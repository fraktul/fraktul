<!-- @bascik
Shared <head> tags for fraktul.dev pages: the title, description and social card of the page being built, fraktul's own fonts, and the theme (the system's, or the reader's switch for this session) and style applied before first paint.
-->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#f2f3f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#050506" media="(prefers-color-scheme: dark)" />
<script data-bascik-build-once src="./robots.ts"></script>
<script data-bascik-build type="text/typescript">
  // Title, description, canonical URL, social card and structured data for the page being built (src/lib/seo.ts).
  // Fonts ship with the site (vendor/fonts/); the ones a page shows first are preloaded.
  import { html } from "@bascik/bascik/html";
  import { fontTags } from "@/lib/fonts.ts";
  import { seoTags } from "@/lib/seo.ts";
  export default function () {
    const path = process.env.BASCIK_PAGE_PATH ?? "/";
    const first = path === "/" ? ["Manrope", "Michroma", "Syncopate"] : ["Manrope", "Michroma"];
    return html`${seoTags(path, process.env.BASCIK_SITE_URL)}${fontTags("/vendor/fonts/", first)}`;
  }
</script>
<script>
  // Light or dark follows the system. A reader's own switch is kept for the session (this tab), then the system rules again.
  try { var t = sessionStorage.getItem("fraktul-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
  // fraktul.dev always wears the y2k style; the map itself defaults to flat.
  document.documentElement.dataset.style = "y2k";
</script>
