<!-- @bascik
fraktul.dev navigation: the bar (liquid chrome in y2k), the foil star, page links, and the light and dark switch.
-->
<style>
  .nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 20px; padding: 12px max(20px, env(safe-area-inset-right, 0px)) 12px max(20px, env(safe-area-inset-left, 0px)); background: var(--bar); box-shadow: var(--gloss); border-bottom: 1px solid var(--line); }
  .logo { display: flex; align-items: center; gap: 12px; color: var(--ink); text-decoration: none; font: 400 17px/1 var(--display); letter-spacing: 0.08em; }
  .star { width: 28px; height: 28px; flex: none; background: var(--foil); background-size: 300% 100%; clip-path: var(--mark-shape, path(evenodd, 'M0 0H28V28H0Z M3 3H25V25H3Z M11 11H25V25H11Z M13.5 13.5H22.5V22.5H13.5Z M17 17H22.5V22.5H17Z'));  }
  .links { display: flex; gap: 6px; margin-left: auto; }
  .links a { color: var(--ink-2); text-decoration: none; font: 500 14px var(--body); padding: 8px 12px; border-radius: 10px; transition: color 0.15s, background 0.15s; }
  .links a:hover { color: var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .switch { font: 500 13px var(--body); padding: 7px 12px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--ink) 14%, transparent); background: var(--btn); color: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); cursor: pointer; transition: border-color 0.15s; }
  .switch:hover { border-color: color-mix(in srgb, var(--ink) 30%, transparent); }
  @media (prefers-reduced-motion: no-preference) { .star { animation: foil 9s linear infinite; } @keyframes foil { to { background-position: 300% 0; } } }
  @media (max-width: 640px) { .links a.hide-sm { display: none; } }
</style>
<header class="nav" data-testid="site-header">
  <a class="logo" href="/" data-testid="site-header-home"><span class="star" aria-hidden="true"></span>fraktul</a>
  <nav class="links" aria-label="Main">
    <a href="/map" data-testid="site-header-map">Map</a>
    <a class="hide-sm" href="/design" data-testid="site-header-design">Design</a>
  </nav>
  <button class="switch" id="theme" type="button" aria-label="Theme" data-testid="site-header-theme">◐</button>
</header>
<script type="text/typescript">
  const root = document.documentElement;
  const themeBtn = document.getElementById("theme") as HTMLButtonElement;
  const show = () => {
    const isDark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    themeBtn.textContent = isDark ? "☾" : "☀";
    themeBtn.setAttribute("aria-label", isDark ? "Switch to light" : "Switch to dark");
  };
  themeBtn.addEventListener("click", () => {
    // Flip to the opposite of what is on screen, whether that came from a saved choice or the system.
    const dark = root.dataset.theme === "dark" || (!root.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
    const next = dark ? "light" : "dark";
    root.dataset.theme = next;
    try { localStorage.setItem("fraktul-theme", next); } catch (e) { /* private window */ }
    show();
  });
  show();
</script>
