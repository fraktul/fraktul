<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script data-bascik-build-once src="@/lib/head.ts"></script>
    <script>
      // Theme before first paint: the saved choice, else the system's.
      try { var t = localStorage.getItem("fraktul-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
      try { var s = localStorage.getItem("fraktul-style"); s = s === "chrome" ? "y2k" : s; document.documentElement.dataset.style = s === "y2k" ? "y2k" : "flat"; } catch (e) { document.documentElement.dataset.style = "flat"; }
    </script>
  </head>
  <body>
    <fraktul-map />
  </body>
</html>
