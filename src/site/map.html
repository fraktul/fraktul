<!doctype html>
<html lang="en">
  <head>
    <site-head />
    <script>
      // The map is the tool, not the website: it starts flat, or with the style picked in its menu.
      try { var s = localStorage.getItem("fraktul-style"); document.documentElement.dataset.style = s === "y2k" ? "y2k" : "flat"; } catch (e) { document.documentElement.dataset.style = "flat"; }
    </script>
  </head>
  <body>
    <h1 class="sr-only">fraktul, mapped with fraktul</h1>
    <fraktul-map />
  </body>
</html>
