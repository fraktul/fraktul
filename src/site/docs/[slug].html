<!doctype html>
<html lang="en">
  <head>
    <site-head />
  </head>
  <body class="site">
    <site-header />
    <main id="main" class="docs-main">
      <script data-bascik-build type="text/typescript">
        import { docPage } from "@/lib/docs.ts";
        export default function () {
          return docPage(JSON.parse(process.env.BASCIK_ROUTE || "{}").params.slug);
        }
      </script>
    </main>
    <site-footer />
    <docs-enhance />
    <script data-bascik-routes type="text/typescript">
      import { loadDocs } from "@/lib/docs.ts";
      export default function () {
        return loadDocs().map((d) => ({ params: { slug: d.slug }, data: { title: d.title } }));
      }
    </script>
  </body>
</html>
