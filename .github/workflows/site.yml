# fraktul.dev on Cloudflare (Worker "fraktul", static assets; see wrangler.jsonc and docs/DEPLOY.md).
#   any branch except main  → a preview version with its own URL (posted on the pull request), marked noindex
#   main                    → production on fraktul.dev
# Needs the repo secret CLOUDFLARE_API_TOKEN (Workers Scripts: Edit; Workers Routes: Edit on the fraktul.dev zone)
# and, if the token can see more than one account, the repo variable CLOUDFLARE_ACCOUNT_ID. Without the token the
# site still builds and the deploy step is skipped with a warning.
name: site
on:
  push:
    branches: ["**"]
  workflow_dispatch:
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Build (production)
        if: env.IS_MAIN == 'true'
        run: npm run site:build
      - name: Build (preview, noindex)
        if: env.IS_MAIN != 'true'
        run: npm run site:build:preview
      - name: No Cloudflare token
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning title=fraktul.dev not deployed::Add the repo secret CLOUDFLARE_API_TOKEN (see docs/DEPLOY.md). The site built; nothing was deployed."
      - name: Deploy production (fraktul.dev)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.IS_MAIN == 'true'
        run: |
          npx wrangler deploy --message "main ${GITHUB_SHA::7}" | tee deploy.log
          echo "### Deployed to https://fraktul.dev" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview
        id: preview
        if: env.CLOUDFLARE_API_TOKEN != '' && env.IS_MAIN != 'true'
        run: |
          alias="$(node scripts/preview-alias.ts)"
          npx wrangler versions upload --preview-alias "$alias" --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" | tee upload.log
          # The alias URL stays the same for the branch; the version URL changes on every upload.
          url="$(grep -i 'alias url' upload.log | grep -oE 'https://[a-z0-9.-]+\.workers\.dev' | head -1)"
          [ -n "$url" ] || url="$(grep -oE 'https://[a-z0-9-]+-fraktul\.[a-z0-9-]+\.workers\.dev' upload.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Post the preview on the pull request
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.preview.outputs.url }}
        run: |
          pr="$(gh pr list --head "$GITHUB_REF_NAME" --json number -q '.[0].number')"
          [ -n "$pr" ] || exit 0
          body="Preview of fraktul.dev for \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}: $URL"
          gh pr comment "$pr" --edit-last --create-if-none --body "$body" || gh pr comment "$pr" --body "$body"
