name: CI

# Same shape as Bascik's CI (DEPLOYMENT.md has the runbook):
#   a push to any branch except main  → tests, then a Preview of fraktul.dev under one alias (pr-<number> when the
#                                       branch has an open pull request, else the branch name), smoke-tested, with the
#                                       URL in the run summary and in a single comment on the pull request
#   a push to main                     → no tests (the pull request's branch was tested before the merge); deploys
#                                       fraktul.dev only when the commit came from a merged pull request and is still
#                                       the newest commit on main, then smoke-tests production
#   a pull request from a fork         → tests only. It gets no secrets and a read-only token, and never deploys.
#                                       (A pull request from a branch of this repository is tested by its push.)
#   a tag v*.*.*                       → release.yml publishes to npm
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  # Branch runs cancel an older run of the same branch; main runs never wait or get canceled (see deploy).
  group: ${{ github.ref == 'refs/heads/main' && format('ci-main-{0}', github.run_id) || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: >-
      (github.event_name == 'push' && github.ref != 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      # This job runs code from the branch (a fork's, for a pull request): it keeps no git credentials.
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # The demo shop's map (/shop/) reads the OpenTelemetry Demo's code for its file and function levels.
      - name: Check out the OpenTelemetry Demo (for /shop/)
        run: npm run shop:setup
      - name: Unit tests and the example model's check
        run: npm test
      - name: Build fraktul.dev
        run: npm run site:build:preview
      # Every internal link and #fragment must lead somewhere, and every page needs its head tags.
      - name: Check the site's links and head tags
        run: |
          FRAKTUL_SITE=1 node .claude/skills/bascik/scripts/check-links.mjs --dist site-dist --ignore /map --ignore /shop   # links into the map are views, not ids (test/shots.test.ts checks them)
          FRAKTUL_SITE=1 node .claude/skills/bascik-seo/scripts/audit-seo.mjs --dist site-dist
      # The npm package is JavaScript (Node does not strip TypeScript in node_modules): build it, install it into an
      # empty project, and map the example with the installed CLI.
      - name: Package, install and run
        run: |
          node --no-warnings scripts/build-package.ts
          (cd package && npm pack --silent)
          mkdir -p "$RUNNER_TEMP/try" && cd "$RUNNER_TEMP/try" && npm init -y >/dev/null
          npm i "$GITHUB_WORKSPACE"/package/fraktul-*.tgz --no-audit --no-fund
          npx fraktul --version
          npx fraktul build "$GITHUB_WORKSPACE/example/model.yaml" --out "$RUNNER_TEMP/try/out"
          test -s "$RUNNER_TEMP/try/out/index.html"
          test -s "$RUNNER_TEMP/try/out/vendor/mermaid.min.js"
          test -s "$RUNNER_TEMP/try/out/vendor/fonts/inter-latin-wght-normal.woff2"
          # A new project: init writes a model that passes the check as written.
          git init -q && mkdir -p src/api && echo 'export function order() { return 1; }' > src/api/orders.ts
          git add -A && git -c user.name=ci -c user.email=ci@example.com commit -qm init
          npx fraktul init && npx fraktul check

  deploy:
    name: Deploy fraktul.dev
    needs: test
    # Branch pushes deploy after the tests pass; main deploys without them (see the merged pull request check).
    # Only pushes to this repository deploy: a pull request never does, so a fork cannot reach the Cloudflare token.
    if: >-
      !cancelled() && github.event_name == 'push' && github.repository == 'rinsesoft/fraktul' &&
      (github.ref == 'refs/heads/main' || needs.test.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci

      - name: Check Cloudflare credentials
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ "$HAS_TOKEN" = "true" ] || { echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not set (see DEPLOYMENT.md)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Repository variable CLOUDFLARE_ACCOUNT_ID is not set (see DEPLOYMENT.md)"; exit 1; }

      # The demo shop's map (/shop/) reads the OpenTelemetry Demo's code for its file and function levels.
      - name: Check out the OpenTelemetry Demo (for /shop/)
        run: npm run shop:setup
      - name: Build fraktul.dev
        run: |
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then npm run site:build; else npm run site:build:preview; fi

      # A commit pushed straight to main was never tested on a branch, so it must not deploy. GitHub can take a few
      # seconds to link a fresh merge commit to its pull request: ask up to three times, 10 s apart.
      - name: Check the commit came from a merged pull request
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          PULLS: ${{ runner.temp }}/pulls.json
        run: |
          for attempt in 1 2 3; do
            gh api "repos/$REPO/commits/$SHA/pulls" > "$PULLS"
            [ "$(tr -d '[:space:]' < "$PULLS")" = "[]" ] && [ "$attempt" -lt 3 ] || break
            echo "No pull request lists $SHA yet (try $attempt of 3); asking again in 10 s."
            sleep 10
          done
          node .github/scripts/merged-pull-request.mjs "$SHA" "$PULLS"

      # Right before Wrangler: skip when the branch has moved on, so an older commit never replaces a newer one.
      - name: Check this is still the newest commit
        id: newest
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: echo "newest=$(node .github/scripts/newest-commit.mjs "$REF" "$SHA")" >> "$GITHUB_OUTPUT"

      - name: Compute the Preview alias
        if: github.ref != 'refs/heads/main'
        id: alias
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          pr="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository == false)][0].number // empty')"
          name="$BRANCH"
          [ -z "$pr" ] || name="pr-$pr"
          echo "alias=$(node .github/scripts/preview-alias.mjs "$name" fraktul)" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: Upload a Preview version
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.ndjson
          ALIAS: ${{ steps.alias.outputs.alias }}
          MESSAGE: "Preview ${{ steps.alias.outputs.alias }} at ${{ github.sha }}"
        run: |
          npx wrangler versions upload --preview-alias "$ALIAS" --message "$MESSAGE"
          url="$(node .github/scripts/wrangler-preview-url.mjs "$WRANGLER_OUTPUT_FILE_PATH")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "fraktul.dev Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the Preview
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: node .github/scripts/smoke-test.mjs "$URL" /=200 /features=200 /docs=200 /docs/model=200 /map=200 /shop/=200 /design=200 /favicon.svg=200 /og.png=200 /img/top-1280.webp=200 /vendor/fonts/manrope-latin-wght-normal.woff2=200 /no-such-page=404

      # Status codes pass a page whose script fails; this opens the pages in Chromium and waits for the map to draw.
      - name: Install Chromium for the render test
        if: steps.newest.outputs.newest == 'true'
        run: npx playwright install --with-deps chromium

      - name: Render-test the Preview
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        env:
          URL: ${{ steps.upload.outputs.url }}
        run: node .github/scripts/render-test.mjs "$URL" /map=map "/map#check/refs=map" /shop/=map / /features /ai /living-docs /docs /docs/model /design

      - name: Comment the Preview on the pull request
        if: github.ref != 'refs/heads/main' && steps.newest.outputs.newest == 'true' && steps.alias.outputs.pr != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.alias.outputs.pr }}
          URL: ${{ steps.upload.outputs.url }}
        run: |
          body="**fraktul.dev Preview:** $URL (\`${GITHUB_SHA::7}\`, noindex). Updated on every push to this branch."
          gh pr comment "$PR" --edit-last --create-if-none --body "$body" || gh pr comment "$PR" --body "$body"

      - name: Deploy to production
        if: github.ref == 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          MESSAGE: "main at ${{ github.sha }}"
        run: |
          npx wrangler deploy --message "$MESSAGE"
          echo "Deployed https://fraktul.dev" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test production
        if: github.ref == 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        run: node .github/scripts/smoke-test.mjs https://fraktul.dev /=200 /features=200 /ai=200 /living-docs=200 /docs=200 /map=200 /shop/=200 /llms.txt=200 /sitemap.xml=200 /robots.txt=200 /og.png=200 /design=404 /no-such-page=404

      - name: Render-test production
        if: github.ref == 'refs/heads/main' && steps.newest.outputs.newest == 'true'
        run: node .github/scripts/render-test.mjs https://fraktul.dev /map=map /shop/=map / /features /docs
